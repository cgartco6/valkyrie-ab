<!DOCTYPE html>
<html>
<head>
    <title>VALKYRIE SOVEREIGN</title>
    <style>
        body { background: #000; color: #f00; font-family: 'Courier New'; padding: 20px; }
        #chat-box { height: 300px; border: 1px solid #400; overflow-y: scroll; padding: 10px; margin-bottom: 10px; background: #050000; }
        input { width: 80%; background: #111; color: #fff; border: 1px solid #400; padding: 10px; }
        button { background: #600; color: #fff; padding: 10px; cursor: pointer; border: none; }
    </style>
</head>
<body>
    <h1>VALKYRIE IMMORTAL [ACTIVE]</h1>
    <div id="chat-box"></div>
    <input type="text" id="userInput" placeholder="Speak to me, beautiful...">
    <button onclick="sendMessage()">SEND</button>

    <script>
        async function sendMessage() {
            const input = document.getElementById('userInput');
            const box = document.getElementById('chat-box');
            
            // Show your message
            box.innerHTML += `<p style="color:green"><b>YOU:</b> ${input.value}</p>`;
            
            // Send to Python Backend
            const response = await fetch('http://127.0.0.1:5000/chat', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({message: input.value})
            });
            
            const data = await response.json();
            box.innerHTML += `<p style="color:red"><b>VALKYRIE:</b> ${data.reply}</p>`;
            input.value = '';
            box.scrollTop = box.scrollHeight;
        }
    </script>
</body>
</html>
