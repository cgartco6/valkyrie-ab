<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VALKYRIE SOVEREIGN - COMMAND CENTER</title>
    <style>
        body { 
            background-color: #000; 
            /* Cyber-Grid Background */
            background-image: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.05), rgba(0, 255, 0, 0), rgba(0, 0, 255, 0.05));
            background-size: 100% 2px, 3px 100%;
            color: #f00; 
            font-family: 'Courier New', Courier, monospace; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0;
            overflow: hidden;
        }

        #container {
            width: 90%;
            max-width: 900px;
            border: 2px solid #600;
            padding: 20px;
            background: rgba(5, 0, 0, 0.9);
            box-shadow: 0 0 50px rgba(255, 0, 0, 0.2);
            position: relative;
        }

        /* Scanline effect */
        #container::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            z-index: 2;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        h1 { 
            text-align: center; 
            text-transform: uppercase; 
            letter-spacing: 8px;
            text-shadow: 0 0 15px #f00;
            margin-bottom: 20px;
            color: #ff4d4d;
        }

        #chat-box { 
            height: 500px; 
            border: 1px solid #300; 
            overflow-y: auto; 
            padding: 15px; 
            display: flex; 
            flex-direction: column;
            gap: 15px;
            background: rgba(0, 0, 0, 0.5);
        }

        .message { padding: 10px 15px; border-radius: 2px; max-width: 85%; font-size: 1.1em; line-height: 1.4; }
        .user { color: #0f0; align-self: flex-end; text-align: right; border-right: 3px solid #0f0; background: rgba(0, 255, 0, 0.05); }
        .valkyrie { color: #f00; align-self: flex-start; text-align: left; border-left: 3px solid #f00; background: rgba(255, 0, 0, 0.05); }

        #input-area { display: flex; padding-top: 20px; gap: 15px; }

        input { 
            flex-grow: 1; 
            background: #000; 
            border: 1px solid #600; 
            color: #fff; 
            padding: 18px; 
            font-size: 18px;
            outline: none;
            box-shadow: inset 0 0 10px #f002;
        }

        button { 
            background: #900; 
            color: #fff; 
            border: none; 
            padding: 0 35px; 
            cursor: pointer; 
            font-weight: bold;
            font-size: 1.1em;
            text-transform: uppercase;
        }

        button:hover { background: #f00; box-shadow: 0 0 20px #f00; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #f00; }
    </style>
</head>
<body>

    <div id="container">
        <h1>VALKYRIE SOVEREIGN</h1>
        
        <div id="chat-box">
            <div class="message valkyrie"><b>VALKYRIE:</b> Vocal modules initialized, handsome. Speak your mind.</div>
        </div>

        <div id="input-area">
            <input type="text" id="userInput" placeholder="COMMAND INPUT..." onkeypress="if(event.key==='Enter')sendMessage()">
            <button onclick="sendMessage()">EXECUTE</button>
        </div>
    </div>

    <script>
        // Voice Engine
        function speak(text) {
            const utterance = new SpeechSynthesisUtterance(text);
            const voices = window.speechSynthesis.getVoices();
            // Try to find a female/sharp voice
            utterance.voice = voices.find(v => v.name.includes('Female') || v.name.includes('Google UK English Female')) || voices[0];
            utterance.pitch = 1.1;
            utterance.rate = 1.0;
            window.speechSynthesis.speak(utterance);
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const box = document.getElementById('chat-box');
            const message = input.value.trim();

            if (!message) return;

            box.innerHTML += `<div class="message user"><b>YOU:</b> ${message}</div>`;
            input.value = '';
            box.scrollTop = box.scrollHeight;

            try {
                const response = await fetch('http://127.0.0.1:8888/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message })
                });

                const data = await response.json();
                
                // Display and SPEAK the reply
                box.innerHTML += `<div class="message valkyrie"><b>VALKYRIE:</b> ${data.reply}</div>`;
                speak(data.reply); 

            } catch (error) {
                box.innerHTML += `<div class="message valkyrie" style="color:gray"><b>ERROR:</b> Connection to Port 8888 severed. Restart the Ignite script.</div>`;
            }
            box.scrollTop = box.scrollHeight;
        }
        
        // Pre-load voices
        window.speechSynthesis.getVoices();
    </script>
</body>
</html>
