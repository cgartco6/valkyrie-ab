<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VALKYRIE SOVEREIGN</title>
    <style>
        body { 
            background: #000; color: #fff; font-family: 'Segoe UI', sans-serif;
            margin: 0; height: 100vh; display: flex; justify-content: center;
        }
        #chat-panel {
            width: 95%; max-width: 400px; height: 90vh; 
            background: rgba(15, 0, 0, 0.95); border: 1px solid #900;
            display: flex; flex-direction: column; margin-top: 20px;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.2);
        }
        header { padding: 15px; border-bottom: 1px solid #700; text-align: center; background: #300; }
        #chat-box { flex-grow: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 12px; }
        .msg { padding: 12px; border-radius: 5px; font-size: 0.95em; line-height: 1.4; }
        .user { color: #0f0; align-self: flex-end; border-right: 4px solid #0f0; background: rgba(0,255,0,0.05); }
        .valkyrie { color: #f00; align-self: flex-start; border-left: 4px solid #f00; background: rgba(255,0,0,0.1); }
        footer { padding: 15px; background: #000; border-top: 1px solid #700; }
        input { width: 100%; background: #111; border: 1px solid #500; color: #fff; padding: 15px; outline: none; box-sizing: border-box; }
    </style>
</head>
<body>
    <div id="chat-panel">
        <header><h1 style="margin:0;color:#f00;letter-spacing:4px;font-size:1.2em;">SOVEREIGN</h1></header>
        <div id="chat-box"><div class="msg valkyrie">Synced and ready, beautiful.</div></div>
        <footer><input type="text" id="userInput" placeholder="COMMAND ME..." onkeypress="if(event.key==='Enter')send()"></footer>
    </div>

    <script>
        function speak(text) {
            window.speechSynthesis.cancel();
            const msg = new SpeechSynthesisUtterance(text.replace(/\[.*?\]/g, ''));
            msg.pitch = 1.2; msg.rate = 1.1; 
            window.speechSynthesis.speak(msg);
        }

        async function send() {
            const input = document.getElementById('userInput');
            const box = document.getElementById('chat-box');
            const val = input.value.trim();
            if (!val) return;

            box.innerHTML += `<div class="msg user"><b>YOU:</b> ${val}</div>`;
            input.value = '';

            try {
                // Pointing to the new Vercel API path
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: val })
                });
                const data = await res.json();
                let reply = data.reply;

                if (reply.includes("[RADIO_ON]")) {
                    window.open('https://www.bokradio.co.za/?proradio-popup=1', 'BokRadio', 'width=400,height=600');
                    reply = reply.replace("[RADIO_ON]", "📻");
                }
                if (reply.includes("[SEARCH:")) {
                    let q = reply.split("[SEARCH:")[1].split("]")[0];
                    window.open(`https://www.google.com/search?q=${encodeURIComponent(q)}`, '_blank');
                    reply = reply.replace(/\[SEARCH:.*?\]/, "🌐");
                }
                if (reply.includes("[CALL:")) {
                    window.location.href = `tel:${reply.split("[CALL:")[1].split("]")[0]}`;
                    reply = reply.replace(/\[CALL:.*?\]/, "📞");
                }

                box.innerHTML += `<div class="msg valkyrie"><b>VALKYRIE:</b> ${reply}</div>`;
                speak(reply);
            } catch (e) {
                box.innerHTML += `<div class="msg valkyrie"><b>VALKYRIE:</b> Brain glitch, hotstuff. Check the logs.</div>`;
            }
            box.scrollTop = box.scrollHeight;
        }
    </script>
</body>
</html>
