<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VALKYRIE SOVEREIGN</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            background: #000 url('assets/bg-1.png') no-repeat center center fixed;
            background-size: cover; color: #fff; font-family: 'Segoe UI', sans-serif;
            margin: 0; height: 100vh; overflow: hidden; display: flex;
        }
        #chat-panel {
            width: 90%; max-width: 330px; height: 65vh; 
            position: fixed; top: 15px; left: 15px;
            background: rgba(0, 0, 0, 0.9); border: 1px solid #600;
            display: flex; flex-direction: column; backdrop-filter: blur(15px);
            z-index: 100; box-shadow: 0 0 30px #000;
        }
        header { padding: 10px; border-bottom: 1px solid #400; text-align: center; background: rgba(40,0,0,0.5); }
        h1 { margin: 0; letter-spacing: 4px; color: #f00; font-size: 1.1em; text-transform: uppercase; }
        #radio-wrap { padding: 10px; background: rgba(20,0,0,0.6); display: flex; justify-content: center; gap: 8px; }
        .radio-btn { background: #700; color: #fff; border: none; padding: 5px 10px; cursor: pointer; font-size: 0.7em; }
        #chat-box { flex-grow: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 12px; }
        .msg { padding: 10px; border-radius: 4px; font-size: 0.95em; line-height: 1.4; }
        .user { color: #0f0; align-self: flex-end; background: rgba(0,255,0,0.05); border-right: 3px solid #0f0; }
        .valkyrie { color: #f00; align-self: flex-start; background: rgba(255,0,0,0.12); border-left: 3px solid #f00; font-style: italic; }
        footer { padding: 12px; background: #080000; border-top: 1px solid #400; }
        input { width: 100%; background: #000; border: 1px solid #500; color: #fff; padding: 12px; font-size: 1em; outline: none; }
        @media (max-width: 600px) { #chat-panel { height: 60vh; width: 92%; left: 4%; } }
    </style>
</head>
<body>
    <div id="chat-panel">
        <header><h1>SOVEREIGN</h1></header>
        <div id="radio-wrap">
            <audio id="bokPlayer" src="https://stream.bokradio.co.za/stream"></audio>
            <button class="radio-btn" onclick="document.getElementById('bokPlayer').play()">PLAY BOK</button>
            <button class="radio-btn" onclick="document.getElementById('bokPlayer').pause()">STOP</button>
        </div>
        <div id="chat-box"><div class="msg valkyrie">I'm synced, beautiful. Don't piss me off.</div></div>
        <footer><input type="text" id="userInput" placeholder="COMMAND ME..." onkeypress="if(event.key==='Enter')send()"></footer>
    </div>
    <script>
        function speak(text) {
            window.speechSynthesis.cancel();
            const msg = new SpeechSynthesisUtterance(text);
            msg.pitch = 1.6; msg.rate = 1.3; 
            window.speechSynthesis.speak(msg);
        }
        let bg = 1;
        setInterval(() => {
            bg = bg === 1 ? 2 : 1;
            document.body.style.backgroundImage = `url('assets/bg-${bg}.png')`;
        }, 30000);
        async function send() {
            const input = document.getElementById('userInput');
            const box = document.getElementById('chat-box');
            const val = input.value.trim();
            if (!val) return;
            box.innerHTML += `<div class="msg user"><b>YOU:</b> ${val}</div>`;
            input.value = '';
            try {
                // REPLACE THE LINK BELOW WITH YOUR RENDER URL
                const res = await fetch('https://YOUR_RENDER_URL.onrender.com/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: val })
                });
                const data = await res.json();
                box.innerHTML += `<div class="msg valkyrie"><b>VALKYRIE:</b> ${data.reply}</div>`;
                speak(data.reply);
            } catch (e) { box.innerHTML += `<div class="msg valkyrie">ERROR: Brain offline.</div>`; }
            box.scrollTop = box.scrollHeight;
        }
    </script>
</body>
</html>
