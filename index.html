<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VALKYRIE SOVEREIGN</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; margin: 0; display: flex; justify-content: center; }
        #chat-panel { width: 95%; max-width: 400px; height: 90vh; background: rgba(20,0,0,0.9); border: 1px solid #800; display: flex; flex-direction: column; margin-top: 10px; }
        #chat-box { flex-grow: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 10px; border-radius: 5px; }
        .user { color: #0f0; align-self: flex-end; background: rgba(0,255,0,0.1); }
        .valkyrie { color: #f00; align-self: flex-start; background: rgba(255,0,0,0.1); }
        input { width: 100%; padding: 15px; background: #111; border: none; color: #fff; border-top: 1px solid #800; }
    </style>
</head>
<body>
    <div id="chat-panel">
        <div id="chat-box"><div class="msg valkyrie">Sovereign Online. Speak, beautiful.</div></div>
        <input type="text" id="userInput" placeholder="COMMAND ME..." onkeypress="if(event.key==='Enter')send()">
    </div>

    <script>
        async function send() {
            const input = document.getElementById('userInput');
            const box = document.getElementById('chat-box');
            const val = input.value;
            if (!val) return;
            box.innerHTML += `<div class="msg user">${val}</div>`;
            input.value = '';

            const res = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: val })
            });
            const data = await res.json();
            let reply = data.reply;

            if (reply.includes("[RADIO_ON]")) {
                window.open('https://www.bokradio.co.za/?proradio-popup=1', 'BokRadio', 'width=400,height=600');
                reply = reply.replace("[RADIO_ON]", "📻");
            }
            if (reply.includes("[SEARCH:")) {
                let q = reply.split("[SEARCH:")[1].split("]")[0];
                window.open(`https://www.google.com/search?q=${encodeURIComponent(q)}`, '_blank');
            }
            if (reply.includes("[CALL:")) {
                window.location.href = `tel:${reply.split("[CALL:")[1].split("]")[0]}`;
            }

            box.innerHTML += `<div class="msg valkyrie">${reply}</div>`;
            box.scrollTop = box.scrollHeight;
        }
    </script>
</body>
</html>
